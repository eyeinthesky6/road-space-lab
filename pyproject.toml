[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roadspacelab"
version = "0.2.0"
description = "Open empirical road-space and mixed-traffic research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Road Space Lab contributors"}]
dependencies = []

[project.scripts]
roadspace = "roadspacelab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
